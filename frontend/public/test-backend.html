<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端连接测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>后端连接测试</h1>
    
    <div class="test-section">
        <h3>当前环境信息</h3>
        <p><strong>当前URL:</strong> <span id="currentUrl"></span></p>
        <p><strong>主机名:</strong> <span id="hostname"></span></p>
        <p><strong>协议:</strong> <span id="protocol"></span></p>
        <p><strong>端口:</strong> <span id="port"></span></p>
    </div>

    <div class="test-section">
        <h3>后端连接测试</h3>
        <button onclick="testBackend('http://111.4.68.108:8081')">测试公网后端 (111.4.68.108:8081)</button>
        <button onclick="testBackend('http://192.168.20.3:8081')">测试内网后端 (192.168.20.3:8081)</button>
        <button onclick="testBackend('http://localhost:8081')">测试本地后端 (localhost:8081)</button>
        <div id="backendResult"></div>
    </div>

    <div class="test-section">
        <h3>登录接口测试</h3>
        <button onclick="testLogin('http://111.4.68.108:8081')">测试公网登录</button>
        <button onclick="testLogin('http://192.168.20.3:8081')">测试内网登录</button>
        <div id="loginResult"></div>
    </div>

    <script>
        // 显示当前环境信息
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('hostname').textContent = window.location.hostname;
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('port').textContent = window.location.port;

        // 测试后端连接
        async function testBackend(baseURL) {
            const resultDiv = document.getElementById('backendResult');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                console.log(`测试后端连接: ${baseURL}`);
                
                // 尝试连接后端
                const response = await fetch(`${baseURL}/login`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">
                        <h4>✅ 后端连接成功</h4>
                        <p><strong>URL:</strong> ${baseURL}</p>
                        <p><strong>状态:</strong> ${response.status}</p>
                    </div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">
                        <h4>❌ 后端连接失败</h4>
                        <p><strong>URL:</strong> ${baseURL}</p>
                        <p><strong>状态:</strong> ${response.status} ${response.statusText}</p>
                    </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">
                    <h4>❌ 后端连接错误</h4>
                    <p><strong>URL:</strong> ${baseURL}</p>
                    <p><strong>错误:</strong> ${error.message}</p>
                    <pre>${error.stack}</pre>
                </div>`;
            }
        }

        // 测试登录
        async function testLogin(baseURL) {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                console.log(`测试登录: ${baseURL}/login`);
                
                const loginData = new URLSearchParams({
                    username: 'admin01',
                    password: '123456'
                });
                
                const response = await fetch(`${baseURL}/login`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: loginData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div class="success">
                        <h4>✅ 登录请求成功</h4>
                        <p><strong>URL:</strong> ${baseURL}/login</p>
                        <p><strong>状态:</strong> ${response.status}</p>
                        <p><strong>响应:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">
                        <h4>❌ 登录请求失败</h4>
                        <p><strong>URL:</strong> ${baseURL}/login</p>
                        <p><strong>状态:</strong> ${response.status} ${response.statusText}</p>
                    </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">
                    <h4>❌ 登录请求错误</h4>
                    <p><strong>URL:</strong> ${baseURL}/login</p>
                    <p><strong>错误:</strong> ${error.message}</p>
                    <pre>${error.stack}</pre>
                </div>`;
            }
        }
    </script>
</body>
</html>
