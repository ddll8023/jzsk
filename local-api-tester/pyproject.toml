[project]
name = "local-api-tester"
version = "0.1.0"
description = "本地 API 检测工具，用于测试后端接口连通性和设备监测状态"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.6",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project.scripts]
local-api-tester = "local_api_tester.main:main"

[project.optional-dependencies]
packaging = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
