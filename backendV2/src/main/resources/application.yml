server:
  port: 8081

spring:
  application:
    name: backendV2
  config:
    import: optional:classpath:application-runtime.yml
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.jzsk.backendv2: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId:-N/A} - %msg%n"

jzsk:
  v2:
    project-name: JZSK Backend V2
    api-prefix: /api
    security:
      header: Authorization
      token-prefix: "Bearer "
      expire-seconds: 604800
      permit-all:
        - /actuator/health
        - /error
      bootstrap-user:
        user-id: 1
        authorities:
          - ROLE_ADMIN
          - system:manage
    task:
      warning-enabled: false
      sync-enabled: false
      task-switches: {}
      zone: Asia/Shanghai
      pool-size: 4
      thread-name-prefix: jzsk-task-
      shutdown-await-seconds: 30
    logging:
      request-enabled: true
      trace-header: X-Trace-Id
