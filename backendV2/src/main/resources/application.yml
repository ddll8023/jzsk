server:
  port: 8081

spring:
  application:
    name: backendV2
  config:
    import: optional:classpath:application-runtime.yml
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.jzsk.backendv2: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId:-N/A} - %msg%n"

jzsk:
  v2:
    project-name: JZSK Backend V2
    api-prefix: /api
    security:
      header: Authorization
      token-prefix: "Bearer "
      expire-seconds: 604800
      permit-all:
        - /actuator/health
        - /error
        - /swagger-ui/**
        - /swagger-ui/index.html
        - /v3/api-docs/**
        - /webjars/**
        - /external-data/**
        - /photo/**
        - /pic/**
        - /shipin/**
        - /app/**
    task:
      warning-enabled: true
      sync-enabled: false
      task-switches:
        warning.water-level-rainfall-check: true
        warning.gnss-check: true
        warning.mcu-check: true
      zone: Asia/Shanghai
      pool-size: 4
      thread-name-prefix: jzsk-task-
      shutdown-await-seconds: 30
    cors:
      allowed-origins:
        - http://localhost:8084
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Requested-With
      allow-credentials: true
      max-age: 3600
    logging:
      request-enabled: true
      trace-header: X-Trace-Id
